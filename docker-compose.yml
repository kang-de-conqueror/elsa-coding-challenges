services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_WS_BASE_URL: ws://localhost:8000
    depends_on:
      server:
        condition: service_healthy
